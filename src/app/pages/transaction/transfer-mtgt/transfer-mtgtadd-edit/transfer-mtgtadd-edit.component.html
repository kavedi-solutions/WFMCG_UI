<page-header
  class="bg-blue-600"
  [title]="PageTitle"
  [addButtonToolTip]="buttonText"
  [showBack]="!isFromQuickMenu"
  [showAdd]="false"
  (onBackClick)="BacktoList()"
></page-header>

<form class="form-field-full page-detail" [formGroup]="transferForm">
  <mat-card>
    <div class="matero-row" fxLayout.lt-sm="column" fxLayout="row">
      <div fxFlex="15%" fxFlex.lt-sm="100" class="matero-col">
        <mat-form-field appearance="legacy" color="primary">
          <input
            matInput
            id="TransferDate"
            [matDatepicker]="TransferDatePicker"
            placeholder="Transfer Date"
            formControlName="TransferDate"
            [min]="TransferMinDate"
            [max]="TransferMaxDate"
            (dateChange)="TransferDateChange()"
            (blur)="TransferDateBlur()"
          />
          <mat-datepicker-toggle
            matSuffix
            [for]="TransferDatePicker"
            [tabIndex]="-1"
            ><mat-icon matDatepickerToggleIcon
              >keyboard_arrow_down</mat-icon
            ></mat-datepicker-toggle
          >
          <mat-datepicker #TransferDatePicker></mat-datepicker>
        </mat-form-field>
      </div>
      <div fxFlex="15%" fxFlex.lt-sm="100" class="matero-col">
        <mat-form-field appearance="legacy" color="primary">
          <mat-label>Transfer No</mat-label>
          <input
            matInput
            placeholder="Transfer No"
            formControlName="TransferNo"
            readonly
          />
        </mat-form-field>
      </div>
      <div fxFlex="60%" fxFlex.lt-sm="100" class="matero-col"></div>
      <div
        fxFlex="10%"
        fxFlex.lt-sm="100"
        class="matero-col stocks"
        *ngIf="I_FromItemIDControl.value != ''"
      >
        <span>Stock</span>
        <br />
        <span>
          {{ CurrentStock?.closingCrt }}/{{ CurrentStock?.closingPcs }}</span
        >
      </div>
    </div>
    <div formGroupName="Items">
      <div class="matero-row" fxLayout.lt-sm="column" fxLayout="row">
        <div fxFlex="40%" fxFlex.lt-sm="100" class="matero-col">
          <mat-form-field appearance="legacy" color="primary">
            <mat-label>Select From Item</mat-label>
            <input
              matInput
              id="FromItemName"
              [matAutocomplete]="AutoFromItemID"
              formControlName="I_FromItemID"
            />
            <mat-autocomplete
              #AutoFromItemID="matAutocomplete"
              [displayWith]="DisplayFromItemName"
              (optionSelected)="SelectedFromItem($event)"
            >
              <mat-option
                *ngFor="let add of filteredFromitemsDropDown | async"
                [value]="add"
              >
                {{ add.item_Name }}
              </mat-option>
            </mat-autocomplete>
          </mat-form-field>
        </div>
        <div fxFlex="40%" fxFlex.lt-sm="100" class="matero-col">
          <mat-form-field appearance="legacy" color="primary">
            <mat-label>Select To Item</mat-label>
            <input
              matInput
              id="ToItemName"
              [matAutocomplete]="AutoToItemID"
              formControlName="I_ToItemID"
            />
            <mat-autocomplete
              #AutoToItemID="matAutocomplete"
              [displayWith]="DisplayToItemName"
              (optionSelected)="SelectedToItem($event)"
            >
              <mat-option
                *ngFor="let add of filteredToitemsDropDown | async"
                [value]="add"
              >
                {{ add.item_Name }}
              </mat-option>
            </mat-autocomplete>
          </mat-form-field>
        </div>
        <div fxFlex="7%" fxFlex.lt-sm="100" class="matero-col">
          <mat-form-field appearance="legacy" color="primary">
            <mat-label>Crt</mat-label>
            <input
              matInput
              id="Crt"
              placeholder="Crt"
              type="text"
              formControlName="I_Crt"
              maxlength="5"
              class="input-right-align"
              (keyup)="CalculateTotals()"
              (blur)="CheckStocks($event, 'Crt')"
            />
          </mat-form-field>
        </div>
        <div fxFlex="7%" fxFlex.lt-sm="100" class="matero-col">
          <mat-form-field appearance="legacy" color="primary">
            <mat-label>Pcs</mat-label>
            <input
              matInput
              id="Pcs"
              placeholder="Pcs"
              type="text"
              formControlName="I_Pcs"
              maxlength="5"
              class="input-right-align"
              (keyup)="CalculateTotals()"
              (blur)="CheckStocks($event, 'Pcs')"
            />
          </mat-form-field>
        </div>
        <div fxFlex="6%" fxFlex.lt-sm="100" class="matero-col">
          <button
            type="button"
            mat-mini-fab
            style="margin-top: 5px"
            color="warn"
            [disabled]="DisableAddItemBtn"
            (click)="AddItemToList()"
          >
            <i class="fa-solid fa-angles-down"></i>
          </button>
        </div>
      </div>
    </div>
    <div class="matero-row" fxLayout.lt-sm="column" fxLayout="row">
      <mtx-grid
        class="table-main-wrapper mtx-grid-sales"
        [data]="transferItemDetailsListData"
        [columns]="columns"
        [length]="ItemCount"
        [rowSelectable]="true"
        [hideRowSelectionCheckbox]="true"
        [rowHover]="true"
        [rowStriped]="false"
        [pageOnFront]="false"
        [showPaginator]="false"
      >
      </mtx-grid>
    </div>
    <mat-card-actions align="end" class="area-mat-card-actions">
      <button
        type="button"
        mat-raised-button
        (click)="BacktoList()"
        color="accent"
      >
        Cancel
      </button>
      <button
        type="button"
        *ngIf="isEditMode == false"
        [disabled]="!transferForm.valid || ItemCount == 0"
        mat-raised-button
        color="primary"
        (click)="SaveUpdateTransfer(transferForm)"
      >
        Save
      </button>
      <button
        type="button"
        *ngIf="isEditMode == true"
        [disabled]="!transferForm.valid || ItemCount == 0"
        mat-raised-button
        color="primary"
        (click)="SaveUpdateTransfer(transferForm)"
      >
        Update
      </button>
    </mat-card-actions>
  </mat-card>
</form>
